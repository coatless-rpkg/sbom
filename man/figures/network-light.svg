<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">Everything sbom does runs on your machine, unless you ask for one of four things</title>
  <desc id="d">Inside your machine: reading DESCRIPTION files, lockfiles and manifests, building the SBOM, writing every format, validating against bundled schemas, and matching OSV advisories. Outside, reached only when asked: OSV&#x27;s advisory export with advisories = TRUE, api.osv.dev for CVSS ratings, sent only public ids, Posit Package Manager with snapshot = &quot;ppm&quot;, and nixpkgs in Nix mode.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.c{font-family:"DIN Condensed","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.edge-s{stroke:#E6D8BE;fill:none}.rail-s{stroke:#CDB898;fill:none}.walrail-s{stroke:#7A5A38;fill:none}.file-s{stroke:#A3927A;fill:none}.arrow-s{stroke:#9A5A22;fill:none}.onaccent-s{stroke:#FFF8EC;fill:none}.walcheck-s{stroke:#2E2218;fill:none}.seam-s{stroke:#B08850;fill:none}.wal-s{stroke:#4A3218;fill:none}.ink-s{stroke:#2E2218;fill:none}.lead-s{stroke:#B9A486;fill:none}.cratefr-s{stroke:#4A3218;fill:none}.card{fill:#FBF6EC}.code{fill:#F2E8D5}.ink{fill:#2E2218}.body{fill:#4F4030}.muted{fill:#7D6B55}.faint{fill:#A3927A}.wal{fill:#4A3218}.onwal{fill:#F6EBD3}.onwalm{fill:#CDB898}.walcard{fill:#5C4126}.wood{fill:#CDA56C}.woodsoft{fill:#EEDFC2}.accent{fill:#9A5A22}.onaccent{fill:#FFF8EC}.fn{fill:#8A4610}.str{fill:#4E6B35}.com{fill:#9A8A72}.key{fill:#6B4A2A}.ok{fill:#3F7D4E}.oksoft{fill:#DDEBDA}.warn{fill:#A0640F}.warnsoft{fill:#F6E6C6}.folder{fill:#C9963F}.walfn{fill:#F2C27E}.walok{fill:#8FCB9B}.ev1{fill:#9A5A22}.ev2{fill:#3F7D4E}.ev3{fill:#3E6F86}.err{fill:#A8322A}.errsoft{fill:#F3DAD3}.slat{fill:#C29A61}.slatdark{fill:#B08850}.crate{fill:#CDA56C}.oncrate{fill:#4A3218}.onwood{fill:#3B2814}</style>
  <rect class="card edge-s" stroke-width="1" x="16" y="16" width="352" height="298" rx="14"/>
  <text class="c ink" x="38" y="56" font-size="26" font-weight="700">Your machine</text>
  <text class="s muted" x="38" y="78" font-size="14">always</text>
  <circle class="ok" cx="46.5" cy="107.5" r="8.5"/>
  <path class="onaccent-s" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M42.9 107.7 l2.7 2.7 l4.9 -5.6"/>
  <text class="s body" x="66" y="112" font-size="14.5">Read DESCRIPTION files, lockfiles</text>
  <circle class="ok" cx="46.5" cy="145.5" r="8.5"/>
  <path class="onaccent-s" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M42.9 145.7 l2.7 2.7 l4.9 -5.6"/>
  <text class="s body" x="66" y="150" font-size="14.5">Build the SBOM</text>
  <circle class="ok" cx="46.5" cy="183.5" r="8.5"/>
  <path class="onaccent-s" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M42.9 183.7 l2.7 2.7 l4.9 -5.6"/>
  <text class="s body" x="66" y="188" font-size="14.5">Write every format</text>
  <circle class="ok" cx="46.5" cy="221.5" r="8.5"/>
  <path class="onaccent-s" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M42.9 221.7 l2.7 2.7 l4.9 -5.6"/>
  <text class="s body" x="66" y="226" font-size="14.5">Validate with bundled schemas</text>
  <circle class="ok" cx="46.5" cy="259.5" r="8.5"/>
  <path class="onaccent-s" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M42.9 259.7 l2.7 2.7 l4.9 -5.6"/>
  <text class="s body" x="66" y="264" font-size="14.5">Match OSV advisories</text>
  <text class="c ink" x="448" y="56" font-size="26" font-weight="700">Only when you ask</text>
  <rect class="code" x="448" y="78" width="256" height="50" rx="9"/>
  <text class="s ink" x="464" y="99" font-size="14.5" font-weight="700">OSV advisory export</text>
  <text class="m fn" x="464" y="118" font-size="13">advisories = TRUE</text>
  <path class="lead-s" stroke-width="1.6" stroke-dasharray="5 4" d="M368 103 H448"/>
  <circle class="accent" cx="368" cy="103" r="3.5"/>
  <rect class="code" x="448" y="138" width="256" height="50" rx="9"/>
  <text class="s ink" x="464" y="159" font-size="14.5" font-weight="700">api.osv.dev</text>
  <text class="m fn" x="464" y="178" font-size="13">CVSS ratings, public ids only</text>
  <path class="lead-s" stroke-width="1.6" stroke-dasharray="5 4" d="M368 163 H448"/>
  <circle class="accent" cx="368" cy="163" r="3.5"/>
  <rect class="code" x="448" y="198" width="256" height="50" rx="9"/>
  <text class="s ink" x="464" y="219" font-size="14.5" font-weight="700">Posit Package Manager</text>
  <text class="m fn" x="464" y="238" font-size="13">snapshot = "ppm"</text>
  <path class="lead-s" stroke-width="1.6" stroke-dasharray="5 4" d="M368 223 H448"/>
  <circle class="accent" cx="368" cy="223" r="3.5"/>
  <rect class="code" x="448" y="258" width="256" height="50" rx="9"/>
  <text class="s ink" x="464" y="279" font-size="14.5" font-weight="700">nixpkgs</text>
  <text class="m fn" x="464" y="298" font-size="13">Nix mode</text>
  <path class="lead-s" stroke-width="1.6" stroke-dasharray="5 4" d="M368 283 H448"/>
  <circle class="accent" cx="368" cy="283" r="3.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">validate_sbom() checks two layers, and sums them up in one status</title>
  <desc id="d">Two layers stacked like boards. At the bottom, the schema layer: the format&#x27;s own schema, bundled. On top, the content layer: sbom&#x27;s integrity rules, on ids, relationships, licenses, purls and R package names, and, under the default profile, the NTIA 2021 minimum elements. The status is pass when every layer that ran passed, partial when one was skipped or could check only part, fail when one failed, and skipped when none ran.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.c{font-family:"DIN Condensed","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.edge-s{stroke:#3D2F22;fill:none}.rail-s{stroke:#5A4630;fill:none}.walrail-s{stroke:#B49A74;fill:none}.file-s{stroke:#7F6E58;fill:none}.arrow-s{stroke:#E3AA68;fill:none}.onaccent-s{stroke:#241B13;fill:none}.walcheck-s{stroke:#F6EBD3;fill:none}.seam-s{stroke:#4E3820;fill:none}.wal-s{stroke:#D2AE78;fill:none}.ink-s{stroke:#F2E6CF;fill:none}.lead-s{stroke:#6E5A42;fill:none}.cratefr-s{stroke:#D2AE78;fill:none}.card{fill:#241B13}.code{fill:#2E241A}.ink{fill:#F2E6CF}.body{fill:#D8C8AC}.muted{fill:#A8957A}.faint{fill:#7F6E58}.wal{fill:#E9D8B8}.onwal{fill:#2E2218}.onwalm{fill:#6E5A42}.walcard{fill:#DCC6A0}.wood{fill:#CDA56C}.woodsoft{fill:#3F3022}.accent{fill:#E3AA68}.onaccent{fill:#241B13}.fn{fill:#EDB46C}.str{fill:#A9C98A}.com{fill:#8C7A62}.key{fill:#D9B88F}.ok{fill:#86C994}.oksoft{fill:#20352A}.warn{fill:#E8B04B}.warnsoft{fill:#3B2C12}.folder{fill:#D9A441}.walfn{fill:#8A4610}.walok{fill:#3F7D4E}.ev1{fill:#E3AA68}.ev2{fill:#86C994}.ev3{fill:#8DBBD3}.err{fill:#E5735F}.errsoft{fill:#3A1E18}.slat{fill:#6A4C2C}.slatdark{fill:#4A331D}.crate{fill:#5A3F25}.oncrate{fill:#F2E4C6}.onwood{fill:#2E2218}</style>
  <path class="slat" d="M30 18 H434 L420 32 H16 Z"/>
  <path class="slatdark" d="M420 32 L434 18 V168 L420 182 Z"/>
  <rect class="wood" x="16" y="32" width="404" height="150" rx="3"/>
  <text class="c onwood" x="36" y="62" font-size="24" font-weight="700">Content</text>
  <rect class="card" x="32" y="78" width="178" height="78" rx="7"/>
  <text class="s ink" x="44" y="100" font-size="14.5" font-weight="700">Integrity rules</text>
  <text class="s muted" x="44" y="120" font-size="12.5">ids, relationships,</text>
  <text class="s muted" x="44" y="137" font-size="12.5">licenses, purls</text>
  <rect class="card" x="222" y="78" width="178" height="78" rx="7"/>
  <text class="s ink" x="234" y="100" font-size="14.5" font-weight="700">NTIA 2021</text>
  <text class="s muted" x="234" y="120" font-size="12.5">seven minimum</text>
  <text class="s muted" x="234" y="137" font-size="12.5">elements, by default</text>
  <path class="slat" d="M30 196 H434 L420 210 H16 Z"/>
  <path class="slatdark" d="M420 210 L434 196 V274 L420 288 Z"/>
  <rect class="wood" x="16" y="210" width="404" height="78" rx="3"/>
  <text class="c onwood" x="36" y="240" font-size="24" font-weight="700">Schema</text>
  <text class="s onwood" x="36" y="264" font-size="14">the format's own, bundled</text>
  <text class="c ink" x="452" y="46" font-size="26" font-weight="700">One status</text>
  <rect class="ok" x="452" y="76" width="84" height="26" rx="13"/>
  <text class="s onaccent" x="494" y="94" font-size="13.5" font-weight="700" text-anchor="middle">pass</text>
  <text class="s body" x="548" y="94" font-size="13.5">every layer that ran</text>
  <text class="s body" x="548" y="112" font-size="13.5">passed</text>
  <rect class="warn" x="452" y="144" width="84" height="26" rx="13"/>
  <text class="s onaccent" x="494" y="162" font-size="13.5" font-weight="700" text-anchor="middle">partial</text>
  <text class="s body" x="548" y="162" font-size="13.5">a layer was skipped, or</text>
  <text class="s body" x="548" y="180" font-size="13.5">checked only part</text>
  <rect class="err" x="452" y="212" width="84" height="26" rx="13"/>
  <text class="s onaccent" x="494" y="230" font-size="13.5" font-weight="700" text-anchor="middle">fail</text>
  <text class="s body" x="548" y="230" font-size="13.5">a layer failed</text>
  <rect class="muted" x="452" y="262" width="84" height="26" rx="13"/>
  <text class="s onaccent" x="494" y="280" font-size="13.5" font-weight="700" text-anchor="middle">skipped</text>
  <text class="s body" x="548" y="280" font-size="13.5">no layer ran</text>
</svg>

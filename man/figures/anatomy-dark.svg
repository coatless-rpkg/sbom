  <path class="warn" d="M207 324.5 L213.6 337 H200.4 Z"/>
  <text class="s onaccent" x="207" y="335.6" font-size="10.0" font-weight="800" text-anchor="middle">!</text>
  <text class="s body" x="222" y="335" font-size="12.5">The license of data.table, MPL-2.0 | file LICENSE,</text>
  <text class="s body" x="222" y="352" font-size="12.5">has no SPDX expression.</text>
  <path class="lead-s" stroke-width="1.3" d="M168 140.5 H188"/>
  <circle class="accent" cx="188" cy="140.5" r="3"/>
  <text class="s body" x="162" y="136.2" font-size="13" text-anchor="end">Each with its version,</text>
  <text class="s body" x="162" y="153.8" font-size="13" text-anchor="end">supplier and license</text>
  <path class="lead-s" stroke-width="1.3" d="M168 188 H205"/>
  <circle class="accent" cx="205" cy="188" r="3"/>
  <text class="s body" x="162" y="175" font-size="13" text-anchor="end">What depends on what:</text>
  <text class="s body" x="162" y="192.5" font-size="13" text-anchor="end">lubridate needs</text>
  <text class="s body" x="162" y="210" font-size="13" text-anchor="end">generics, timechange</text>
  <path class="lead-s" stroke-width="1.3" d="M578 67.5 H520"/>
  <circle class="accent" cx="520" cy="67.5" r="3"/>
  <text class="s body" x="584" y="63.2" font-size="13">What it describes,</text>
  <text class="s body" x="584" y="80.8" font-size="13">who wrote it, when</text>
  <path class="lead-s" stroke-width="1.3" d="M560 125 H566 V280 H560"/>
  <path class="lead-s" stroke-width="1.3" d="M578 202.5 H566"/>
  <text class="s body" x="584" y="198.2" font-size="13">Every component,</text>
  <text class="s body" x="584" y="215.8" font-size="13">one row each</text>
  <path class="lead-s" stroke-width="1.3" d="M578 330.5 H556"/>
  <circle class="accent" cx="556" cy="330.5" r="3"/>
  <text class="s body" x="584" y="326.2" font-size="13">Each gap, in</text>
  <text class="s body" x="584" y="343.8" font-size="13">one sentence</text>
</svg>

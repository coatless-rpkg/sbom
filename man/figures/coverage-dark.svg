  <circle class="lead-s" stroke-width="2" cx="554" cy="300" r="7"/>
  <circle class="wal" cx="652" cy="300" r="8"/>
  <text class="s ink" x="38" y="341" font-size="14.5">Advisories</text>
  <circle class="wal-s" stroke-width="2" cx="358" cy="336" r="7"/>
  <path class="wal" d="M358 329 A7 7 0 0 0 358 343 Z"/>
  <circle class="wal-s" stroke-width="2" cx="456" cy="336" r="7"/>

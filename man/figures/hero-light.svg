  <path class="wal" d="M330 24 a12 12 0 0 1 12 -12 h594 a12 12 0 0 1 12 12 v44 h-618 z"/>
  <text class="c onwal" x="352" y="51" font-size="23" font-weight="700" letter-spacing="1.5">SOFTWARE BILL OF MATERIALS</text>
  <text class="m onwalm" x="926" y="49" font-size="14" text-anchor="end">my-analysis</text>
  <text class="s muted" x="352" y="98" font-size="13" font-weight="700">Component</text>
  <text class="s muted" x="502" y="98" font-size="13" font-weight="700">Version</text>

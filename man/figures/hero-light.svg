<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d">
  <title id="t">sbom() turns an R project into a software bill of materials</title>
  <desc id="d">Left: an R project, a folder holding an analysis script, a Quarto report and an renv lockfile, and the call sbom(&quot;my-analysis&quot;). Right: the SBOM it makes, a packing list of every component with its version, license and supplier: cli 3.6.5, jsonlite 2.0.0 and xml2 1.4.0, all MIT and from CRAN, and an in-house package, inhouse 0.3.0, whose license and supplier are unknown. Those two gaps are flagged in the list, and an override can supply them. write_sbom() saves the list as CycloneDX, SPDX 2, SPDX 3, SWID or a CSV.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.c{font-family:"DIN Condensed","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.card{fill:#FBF6EC}.code{fill:#F2E8D5}.ink{fill:#2E2218}.body{fill:#4F4030}.muted{fill:#7D6B55}.faint{fill:#A3927A}.wal{fill:#4A3218}.onwal{fill:#F6EBD3}.onwalm{fill:#CDB898}.walcard{fill:#5C4126}.wood{fill:#CDA56C}.woodsoft{fill:#EEDFC2}.accent{fill:#9A5A22}.onaccent{fill:#FFF8EC}.fn{fill:#8A4610}.str{fill:#4E6B35}.com{fill:#9A8A72}.key{fill:#6B4A2A}.ok{fill:#3F7D4E}.oksoft{fill:#DDEBDA}.warn{fill:#A0640F}.warnsoft{fill:#F6E6C6}.folder{fill:#C9963F}.walfn{fill:#F2C27E}.walok{fill:#8FCB9B}.ev1{fill:#9A5A22}.ev2{fill:#3F7D4E}.ev3{fill:#3E6F86}.err{fill:#A8322A}.errsoft{fill:#F3DAD3}.slat{fill:#C29A61}.slatdark{fill:#B08850}.crate{fill:#CDA56C}.oncrate{fill:#4A3218}.onwood{fill:#3B2814}.edge-s{stroke:#E6D8BE;fill:none}.rail-s{stroke:#CDB898;fill:none}.walrail-s{stroke:#7A5A38;fill:none}.file-s{stroke:#A3927A;fill:none}.arrow-s{stroke:#9A5A22;fill:none}.onaccent-s{stroke:#FFF8EC;fill:none}.walcheck-s{stroke:#2E2218;fill:none}.seam-s{stroke:#B08850;fill:none}.wal-s{stroke:#4A3218;fill:none}.ink-s{stroke:#2E2218;fill:none}.lead-s{stroke:#B9A486;fill:none}.cratefr-s{stroke:#4A3218;fill:none}</style>
  <rect class="card edge-s" stroke-width="1" x="12" y="12" width="262" height="356" rx="12"/>
  <text class="c ink" x="32" y="52" font-size="26" font-weight="700">Your R project</text>
  <path class="folder" d="M34 85 h5 l2 2 h7 v9 h-14 z"/>
  <text class="m ink" x="56" y="94" font-size="14" font-weight="600">my-analysis/</text>
  <path class="rail-s" stroke-width="1" d="M41 100 L41 118"/>
  <path class="rail-s" stroke-width="1" d="M41 118 L52 118"/>
  <path class="file-s" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" d="M59 111 h7 l4 4 v10 h-11 z M66 111 v4 h4"/>
  <text class="m body" x="78" y="122" font-size="14">analysis.R</text>
  <path class="rail-s" stroke-width="1" d="M41 128 L41 146"/>
  <path class="rail-s" stroke-width="1" d="M41 146 L52 146"/>
  <path class="file-s" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" d="M59 139 h7 l4 4 v10 h-11 z M66 139 v4 h4"/>
  <text class="m body" x="78" y="150" font-size="14">report.qmd</text>
  <path class="rail-s" stroke-width="1" d="M41 156 L41 174"/>
  <path class="rail-s" stroke-width="1" d="M41 174 L52 174"/>
  <path class="file-s" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" d="M59 167 h7 l4 4 v10 h-11 z M66 167 v4 h4"/>
  <text class="m body" x="78" y="178" font-size="14">renv.lock</text>
  <rect class="code" x="28" y="218" width="230" height="54" rx="8"/>
  <text class="m" x="42" y="251" font-size="14" xml:space="preserve"><tspan class="fn">sbom</tspan><tspan class="body">(</tspan><tspan class="str">"my-analysis"</tspan><tspan class="body">)</tspan></text>
  <text class="s muted" x="32" y="308" font-size="13.5">A package, a library, a lockfile,</text>
  <text class="s muted" x="32" y="326.9" font-size="13.5">a Shiny app or a Nix file works too.</text>
  <circle class="accent" cx="302" cy="190" r="17"/>
  <path class="onaccent-s" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M295 190 H309 M303.5 184.5 L309 190 L303.5 195.5"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d">
  <title id="t">One row of sbom-overrides.csv, and what each column says</title>
  <desc id="d">The row: inhouse, license_spdx, LicenseRef-Proprietary, Jo Reviewer, Agreed with legal (LEG-42). The component is a name or ref from sbom_components(). The field is one of seven. The value is the answer. asserted_by says who gave it, and reason says why. Saved as sbom-overrides.csv in the project folder, sbom() applies the rows.</desc>

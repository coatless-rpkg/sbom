<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">read_sbom() reads eight formats into one object, and write_sbom() writes any of them</title>
  <desc id="d">Left: the eight formats, from any tool: CycloneDX JSON and XML, SPDX JSON, YAML, XML and tag-value, SPDX 3 JSON-LD and SWID tags. read_sbom() turns any of them into one sbom object, which sbom_components(), sbom_dependencies(), sbom_issues() and sbom_advisories() inspect, and write_sbom() writes it back out in any of the formats.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.c{font-family:"DIN Condensed","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.card{fill:#241B13}.code{fill:#2E241A}.ink{fill:#F2E6CF}.body{fill:#D8C8AC}.muted{fill:#A8957A}.faint{fill:#7F6E58}.wal{fill:#E9D8B8}.onwal{fill:#2E2218}.onwalm{fill:#6E5A42}.walcard{fill:#DCC6A0}.wood{fill:#CDA56C}.woodsoft{fill:#3F3022}.accent{fill:#E3AA68}.onaccent{fill:#241B13}.fn{fill:#EDB46C}.str{fill:#A9C98A}.com{fill:#8C7A62}.key{fill:#D9B88F}.ok{fill:#86C994}.oksoft{fill:#20352A}.warn{fill:#E8B04B}.warnsoft{fill:#3B2C12}.folder{fill:#D9A441}.walfn{fill:#8A4610}.walok{fill:#3F7D4E}.ev1{fill:#E3AA68}.ev2{fill:#86C994}.ev3{fill:#8DBBD3}.err{fill:#E5735F}.errsoft{fill:#3A1E18}.slat{fill:#6A4C2C}.slatdark{fill:#4A331D}.crate{fill:#5A3F25}.oncrate{fill:#F2E4C6}.onwood{fill:#2E2218}.edge-s{stroke:#3D2F22;fill:none}.rail-s{stroke:#5A4630;fill:none}.walrail-s{stroke:#B49A74;fill:none}.file-s{stroke:#7F6E58;fill:none}.arrow-s{stroke:#E3AA68;fill:none}.onaccent-s{stroke:#241B13;fill:none}.walcheck-s{stroke:#F6EBD3;fill:none}.seam-s{stroke:#4E3820;fill:none}.wal-s{stroke:#D2AE78;fill:none}.ink-s{stroke:#F2E6CF;fill:none}.lead-s{stroke:#6E5A42;fill:none}.cratefr-s{stroke:#D2AE78;fill:none}</style>
  <rect class="card edge-s" stroke-width="1" x="16" y="16" width="272" height="298" rx="12"/>
  <text class="c ink" x="36" y="56" font-size="26" font-weight="700">Eight formats</text>
  <text class="s muted" x="36" y="78" font-size="14">from any tool</text>
  <rect class="woodsoft" x="32" y="98" width="240" height="22" rx="11.0"/>
  <text class="s ink" x="152" y="113.7" font-size="13" font-weight="600" text-anchor="middle">CycloneDX JSON</text>
  <rect class="woodsoft" x="32" y="124" width="240" height="22" rx="11.0"/>
  <text class="s ink" x="152" y="139.7" font-size="13" font-weight="600" text-anchor="middle">CycloneDX XML</text>
  <rect class="woodsoft" x="32" y="150" width="240" height="22" rx="11.0"/>
  <text class="s ink" x="152" y="165.7" font-size="13" font-weight="600" text-anchor="middle">SPDX JSON</text>
  <rect class="woodsoft" x="32" y="176" width="240" height="22" rx="11.0"/>
  <text class="s ink" x="152" y="191.7" font-size="13" font-weight="600" text-anchor="middle">SPDX YAML</text>
  <rect class="woodsoft" x="32" y="202" width="240" height="22" rx="11.0"/>
  <text class="s ink" x="152" y="217.7" font-size="13" font-weight="600" text-anchor="middle">SPDX XML</text>
  <rect class="woodsoft" x="32" y="228" width="240" height="22" rx="11.0"/>
  <text class="s ink" x="152" y="243.7" font-size="13" font-weight="600" text-anchor="middle">SPDX tag-value</text>
  <rect class="woodsoft" x="32" y="254" width="240" height="22" rx="11.0"/>
  <text class="s ink" x="152" y="269.7" font-size="13" font-weight="600" text-anchor="middle">SPDX 3 JSON-LD</text>
  <rect class="woodsoft" x="32" y="280" width="240" height="22" rx="11.0"/>
  <text class="s ink" x="152" y="295.7" font-size="13" font-weight="600" text-anchor="middle">SWID tag</text>
  <rect class="wal" x="432" y="16" width="272" height="298" rx="12"/>
  <text class="m onwal" x="452" y="58" font-size="28" font-weight="700">&lt;sbom&gt;</text>
  <text class="s onwalm" x="452" y="80" font-size="14">one object, any format</text>
  <rect class="walcard" x="448" y="100" width="240" height="44" rx="8"/>
  <text class="m walfn" x="462" y="119" font-size="13.5" font-weight="600">sbom_components()</text>
  <text class="s onwalm" x="462" y="136" font-size="13">what is inside</text>
  <rect class="walcard" x="448" y="152" width="240" height="44" rx="8"/>
  <text class="m walfn" x="462" y="171" font-size="13.5" font-weight="600">sbom_dependencies()</text>
  <text class="s onwalm" x="462" y="188" font-size="13">what needs what</text>
  <rect class="walcard" x="448" y="204" width="240" height="44" rx="8"/>
  <text class="m walfn" x="462" y="223" font-size="13.5" font-weight="600">sbom_issues()</text>
  <text class="s onwalm" x="462" y="240" font-size="13">what is unknown</text>
  <rect class="walcard" x="448" y="256" width="240" height="44" rx="8"/>
  <text class="m walfn" x="462" y="275" font-size="13.5" font-weight="600">sbom_advisories()</text>
  <text class="s onwalm" x="462" y="292" font-size="13">what OSV lists</text>
  <path class="arrow-s" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M300 134 H420"/>
  <path class="arrow-s" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M420 134 l-9 -6 M420 134 l-9 6"/>
  <rect class="accent" x="302" y="100" width="116" height="26" rx="13.0"/>
  <text class="m onaccent" x="360" y="117.7" font-size="13" font-weight="600" text-anchor="middle">read_sbom()</text>
  <path class="arrow-s" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M300 212 H420"/>
  <path class="arrow-s" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M300 212 l9 -6 M300 212 l9 6"/>
  <rect class="accent" x="302" y="222" width="116" height="26" rx="13.0"/>
  <text class="m onaccent" x="360" y="239.7" font-size="13" font-weight="600" text-anchor="middle">write_sbom()</text>
</svg>

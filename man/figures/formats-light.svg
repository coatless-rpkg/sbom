  <rect class="walcard" x="448" y="152" width="240" height="44" rx="8"/>
  <text class="m walfn" x="462" y="171" font-size="13.5" font-weight="600">sbom_dependencies()</text>
  <text class="s onwalm" x="462" y="188" font-size="13">what needs what</text>
  <rect class="walcard" x="448" y="204" width="240" height="44" rx="8"/>
  <text class="m walfn" x="462" y="223" font-size="13.5" font-weight="600">sbom_issues()</text>
  <text class="s onwalm" x="462" y="240" font-size="13">what is unknown</text>
  <rect class="walcard" x="448" y="256" width="240" height="44" rx="8"/>
  <text class="m walfn" x="462" y="275" font-size="13.5" font-weight="600">sbom_advisories()</text>
  <text class="s onwalm" x="462" y="292" font-size="13">what OSV lists</text>
  <path class="arrow-s" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M300 134 H420"/>
  <path class="arrow-s" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M420 134 l-9 -6 M420 134 l-9 6"/>
  <rect class="accent" x="302" y="100" width="116" height="26" rx="13.0"/>
  <text class="m onaccent" x="360" y="117.7" font-size="13" font-weight="600" text-anchor="middle">read_sbom()</text>
  <path class="arrow-s" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M300 212 H420"/>
  <path class="arrow-s" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M300 212 l9 -6 M300 212 l9 6"/>
  <rect class="accent" x="302" y="222" width="116" height="26" rx="13.0"/>
  <text class="m onaccent" x="360" y="239.7" font-size="13" font-weight="600" text-anchor="middle">write_sbom()</text>
</svg>

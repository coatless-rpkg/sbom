  <rect class="woodsoft" x="572" y="333" width="70" height="24" rx="12.0"/>
  <text class="s ink" x="607" y="349.5" font-size="12.5" font-weight="600" text-anchor="middle">SPDX 2</text>
  <rect class="woodsoft" x="650" y="333" width="70" height="24" rx="12.0"/>

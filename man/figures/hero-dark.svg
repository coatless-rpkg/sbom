  <path class="edge-s" stroke-width="1" d="M346 148 L932 148"/>
  <text class="m ink" x="352" y="170" font-size="15" font-weight="600">jsonlite</text>
  <text class="m body" x="502" y="170" font-size="15">2.0.0</text>
  <text class="s body" x="592" y="170" font-size="15">MIT</text>
  <text class="s body" x="782" y="170" font-size="15">CRAN</text>
  <path class="edge-s" stroke-width="1" d="M346 182 L932 182"/>
  <text class="m ink" x="352" y="204" font-size="15" font-weight="600">xml2</text>
  <text class="m body" x="502" y="204" font-size="15">1.4.0</text>
  <text class="s body" x="592" y="204" font-size="15">MIT</text>
  <text class="s body" x="782" y="204" font-size="15">CRAN</text>
  <path class="edge-s" stroke-width="1" d="M346 216 L932 216"/>
  <rect class="warnsoft" x="342" y="215" width="594" height="34" rx="7"/>
  <text class="m ink" x="352" y="238" font-size="15" font-weight="600">inhouse</text>
  <text class="m body" x="502" y="238" font-size="15">0.3.0</text>
  <path class="warn" d="M599.5 225.5 L606.6 238.9 H592.4 Z"/>
  <text class="s onaccent" x="599.5" y="237.4" font-size="10.714285714285714" font-weight="800" text-anchor="middle">!</text>
  <text class="s warn" x="614" y="238" font-size="15" font-weight="700">unknown</text>
  <path class="warn" d="M789.5 225.5 L796.6 238.9 H782.4 Z"/>
  <text class="s onaccent" x="789.5" y="237.4" font-size="10.714285714285714" font-weight="800" text-anchor="middle">!</text>
  <text class="s warn" x="804" y="238" font-size="15" font-weight="700">unknown</text>
  <text class="s muted" x="352" y="272" font-size="13.5">and R with its base packages</text>
  <text class="s body" x="352" y="310" font-size="14">Supply the missing license and supplier with an override.</text>
  <path class="edge-s" stroke-width="1.2" d="M346 323 L932 323"/>
  <text class="m" x="352" y="349" font-size="14" xml:space="preserve"><tspan class="fn">write_sbom</tspan><tspan class="body">()</tspan></text>
  <rect class="woodsoft" x="472" y="333" width="92" height="24" rx="12.0"/>

  <path class="edge-s" stroke-width="1.2" d="M32 356 L688 356"/>
  <text class="m fn" x="38" y="380" font-size="14">validate_sbom(x)</text>
  <text class="s err" x="446" y="380" font-size="14" font-weight="700" text-anchor="middle">fail</text>

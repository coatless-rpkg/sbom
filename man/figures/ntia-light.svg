<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t d">
  <title id="t">The NTIA minimum elements of the study&#x27;s SBOM, before and after the overrides</title>
  <desc id="d">Seven elements. In the first draft, the component names, the dependencies and the timestamp pass, and four fail: supplier (2 findings), version (1), unique identifier (3) and author (1). With the overrides and an author, all seven pass.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">How strongly sbom() trusts each source in a project folder</title>
  <desc id="d">Five sources, as bars from strongest to weakest: renv.lock, manifest.json, default.nix, DESCRIPTION and the R code. sbom() builds from the strongest one present and cross-checks it against the others. In the analysis example, renv.lock builds the SBOM; manifest.json and the code cross-check it; default.nix and DESCRIPTION are not in the folder.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.c{font-family:"DIN Condensed","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.card{fill:#FBF6EC}.code{fill:#F2E8D5}.ink{fill:#2E2218}.body{fill:#4F4030}.muted{fill:#7D6B55}.faint{fill:#A3927A}.wal{fill:#4A3218}.onwal{fill:#F6EBD3}.onwalm{fill:#CDB898}.walcard{fill:#5C4126}.wood{fill:#CDA56C}.woodsoft{fill:#EEDFC2}.accent{fill:#9A5A22}.onaccent{fill:#FFF8EC}.fn{fill:#8A4610}.str{fill:#4E6B35}.com{fill:#9A8A72}.key{fill:#6B4A2A}.ok{fill:#3F7D4E}.oksoft{fill:#DDEBDA}.warn{fill:#A0640F}.warnsoft{fill:#F6E6C6}.folder{fill:#C9963F}.walfn{fill:#F2C27E}.walok{fill:#8FCB9B}.ev1{fill:#9A5A22}.ev2{fill:#3F7D4E}.ev3{fill:#3E6F86}.err{fill:#A8322A}.errsoft{fill:#F3DAD3}.slat{fill:#C29A61}.slatdark{fill:#B08850}.crate{fill:#CDA56C}.oncrate{fill:#4A3218}.onwood{fill:#3B2814}.edge-s{stroke:#E6D8BE;fill:none}.rail-s{stroke:#CDB898;fill:none}.walrail-s{stroke:#7A5A38;fill:none}.file-s{stroke:#A3927A;fill:none}.arrow-s{stroke:#9A5A22;fill:none}.onaccent-s{stroke:#FFF8EC;fill:none}.walcheck-s{stroke:#2E2218;fill:none}.seam-s{stroke:#B08850;fill:none}.wal-s{stroke:#4A3218;fill:none}.ink-s{stroke:#2E2218;fill:none}.lead-s{stroke:#B9A486;fill:none}.cratefr-s{stroke:#4A3218;fill:none}</style>
  <text class="c ink" x="16" y="36" font-size="26" font-weight="700">Evidence strength</text>
  <text class="s muted" x="16" y="58" font-size="14">in the analysis example</text>
  <text class="m ink" x="136" y="105" font-size="14" font-weight="600" text-anchor="end">renv.lock</text>
  <rect class="wal" x="150" y="84" width="370" height="30" rx="6"/>
  <text class="s accent" x="532" y="104" font-size="14" font-weight="700">builds the SBOM</text>
  <text class="m ink" x="136" y="147" font-size="14" font-weight="600" text-anchor="end">manifest.json</text>
  <rect class="wood" x="150" y="126" width="296" height="30" rx="6"/>
  <text class="s accent" x="458" y="146" font-size="14" font-weight="700">cross-checks</text>
  <text class="m faint" x="136" y="189" font-size="14" font-weight="600" text-anchor="end">default.nix</text>
  <rect class="card edge-s" stroke-width="1" x="150" y="168" width="222" height="30" rx="6"/>
  <text class="s faint" x="384" y="188" font-size="14">not in this folder</text>
  <text class="m faint" x="136" y="231" font-size="14" font-weight="600" text-anchor="end">DESCRIPTION</text>
  <rect class="card edge-s" stroke-width="1" x="150" y="210" width="148" height="30" rx="6"/>
  <text class="s faint" x="310" y="230" font-size="14">not in this folder</text>
  <text class="m ink" x="136" y="273" font-size="14" font-weight="600" text-anchor="end">the R code</text>
  <rect class="wood" x="150" y="252" width="74" height="30" rx="6"/>
  <text class="s accent" x="236" y="272" font-size="14" font-weight="700">cross-checks</text>
  <text class="s muted" x="150" y="304" font-size="13">stronger</text>
  <path class="lead-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M216 300 H450"/>
  <text class="s muted" x="520" y="304" font-size="13" text-anchor="end">weaker</text>
  <path class="lead-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M216 300 l7 -4 M216 300 l7 4"/>
  <path class="lead-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M450 300 l-7 -4 M450 300 l-7 4"/>
</svg>
